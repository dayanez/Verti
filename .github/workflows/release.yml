name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            cross_cc: aarch64-linux-gnu-gcc
            cross_cxx: aarch64-linux-gnu-g++
          - os: macos-13
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            use_zig: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install arm64 cross compiler
        if: matrix.cross_cc
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install zig
        if: matrix.use_zig
        shell: bash
        run: |
          curl -fsSL -o zig.zip https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip
          unzip -q zig.zip
          echo "$(pwd -W)/zig-x86_64-windows-0.16.0" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          EXT=""
          if [ "${{ matrix.use_zig }}" = "true" ]; then
            export CC="zig cc"
            export CXX="zig c++"
          fi
          if [ -n "${{ matrix.cross_cc }}" ]; then
            export CC="${{ matrix.cross_cc }}"
            export CXX="${{ matrix.cross_cxx }}"
          fi
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          mkdir -p dist
          NAME="verti-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          go build -o "dist/${NAME}" ./cmd/verti
          echo "ASSET=dist/${NAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: verti-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
